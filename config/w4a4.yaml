GENERAL:
  GPU_ID: 0
  SEED: 123
  WORKER: 8
  SAVE_PREFIX: outputs/uhdm
  EXP_NAME: quantdemoire_w4a4_stable_repro_s123

DATA:
  DATA_TYPE: UHDM
  TRAIN_DATASET: data/UHDM/train
  TEST_DATASET: data/UHDM/test
  CALI_DATASET: data/UHDM/train

MODEL:
  EN_FEATURE_NUM: 48
  EN_INTER_NUM: 32
  DE_FEATURE_NUM: 64
  DE_INTER_NUM: 32
  SAM_NUMBER: 1

TRAIN:
  BATCH_SIZE: 1
  LOADER: crop
  CROP_SIZE: 512
  RESIZE_SIZE: 384
  SAVE_ITER: 500
  LOAD_EPOCH: false
  LAM: 1
  LAM_P: 1

TEST:
  TEST_EPOCH: auto
  SAVE_IMG: false
  LOAD_PATH: checkpoints/uhdm_checkpoint.pth
  EVALUATION_METRIC: true

QUANTIZATION:
  QUANT_MODE: online
  QUANT_STATE_PATH: outputs/uhdm/quantdemoire_w4a4_stable_repro_s123/quant_state.pth
  SAVE_QUANT_STATE: true
  METHOD: quantdemoire
  N_BITS_W: 4
  N_BITS_A: 4
  WEIGHT_OBSERVER: quantdemoire_weight
  ACT_OBSERVER: quantdemoire_act
  WEIGHT_SYMMETRIC: true
  ACT_SYMMETRIC: false
  USE_SMOOTH_SCALE: true
  # The local fake-quantizer represents weight bounds as unconstrained lower/
  # upper tensors. Training them directly can invert the interval, so the
  # paper-aligned run keeps the sampled weight boundaries fixed.
  LEARN_WEIGHT_BOUNDS: false
  SMOOTH_ALPHA: 0.5
  INPUT_CHANNEL_SAMPLE_RATE: 0.0
  ACT_SAMPLE_RATE: 0.0
  INPUT_CHANNEL_SAMPLE_SIZE: 1024
  ACT_SAMPLE_SIZE: 10000
  ACT_PERCENTILE_LOW: 0.1
  ACT_PERCENTILE_HIGH: 99.9
  WEIGHT_PERCENTILE_LOW: 0.5
  WEIGHT_PERCENTILE_HIGH: 99.5
  ENABLE_WEIGHT_OUTLIER_FP16: true
  WEIGHT_OUTLIER_MODE: percentile_fp16
  WEIGHT_OUTLIER_PERCENTILE: 0.5
  SKIP_FIRST_CONV: true
  SKIP_LAST_CONV: true

CALIBRATION:
  CALI_NUM: 200
  CALI_BATCH_SIZE: 1
  CALI_USE_TRAIN_CROPS: false

FREQUENCY:
  FREQUENCY_ENABLE: true
  FINETUNE_ENABLE: false
  ALTERNATE_FINETUNE: false
  FREQUENCY_LOSS_TYPE: gaussian
  GAUSSIAN_LEVELS: 3
  FAC_PERCEPTUAL_WEIGHT: 1.0
  FAC_PERCEPTUAL_FEATURE_INDICES: [3, 8, 15]
  AUX_FULL_L1_WEIGHT: 0.0
  FREQUENCY_EPOCHS: 4
  FREQUENCY_LR: 0.001
  FREQUENCY_SAMPLE_NUM: 200
  FREQUENCY_BATCH_SIZE: 1
  TRAIN_SMOOTH: false
  FREQUENCY_SCHEDULER: none
  FREQUENCY_SCHEDULER_T0_EPOCHS: 1
  FREQUENCY_SCHEDULER_T_MULT: 1
  FREQUENCY_SCHEDULER_ETA_MIN: 0.000001
