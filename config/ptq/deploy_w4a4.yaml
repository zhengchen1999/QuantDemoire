# ESDNet/UHDM PTQ template; the reproduction command applies the adjusted recipe in README.md.
CALIBRATION:
  CALI_BATCH_SIZE: 1
  CALI_NUM: 200
  CALI_USE_TRAIN_CROPS: true
DATA:
  CALI_DATASET: data/UHDM-paper-calibration/train
  DATA_TYPE: UHDM
  TEST_DATASET: data/UHDM-full/test
  TRAIN_DATASET: data/UHDM-paper-calibration/train
FREQUENCY:
  ALTERNATE_FINETUNE: false
  AUX_FULL_L1_WEIGHT: 0.0
  FAC_PERCEPTUAL_FEATURE_INDICES:
  - 15
  FAC_PERCEPTUAL_WEIGHT: 1.0
  FINETUNE_ENABLE: false
  FREQUENCY_BATCH_SIZE: 1
  FREQUENCY_ENABLE: true
  FREQUENCY_EPOCHS: 4
  FREQUENCY_LOSS_TYPE: gaussian
  FREQUENCY_LR: 0.001
  FREQUENCY_SAMPLE_NUM: 200
  FREQUENCY_SCHEDULER: cosine_restarts
  FREQUENCY_SCHEDULER_ETA_MIN: 1.0e-06
  FREQUENCY_SCHEDULER_T0_EPOCHS: 1
  FREQUENCY_SCHEDULER_T_MULT: 1
  GAUSSIAN_LEVELS: 3
  TRAIN_SMOOTH: false
  GAUSSIAN_FIRST_DILATION: 2
  FAC_PERCEPTUAL_PREPROCESS: esdnet
GENERAL:
  EXP_NAME: esdnet_uhdm_deploy_w4a4_s123
  GPU_ID: 0
  SAVE_PREFIX: outputs/ptq
  SEED: 123
  WORKER: 8
MODEL:
  DE_FEATURE_NUM: 64
  DE_INTER_NUM: 32
  EN_FEATURE_NUM: 48
  EN_INTER_NUM: 32
  SAM_NUMBER: 1
QUANTIZATION:
  ACT_OBSERVER: sample_minmax
  ACT_PERCENTILE_HIGH: 99.9
  ACT_PERCENTILE_LOW: 0.1
  ACT_SAMPLE_RATE: 0.001
  ACT_SAMPLE_SIZE: 10000
  ACT_SYMMETRIC: false
  ENABLE_WEIGHT_OUTLIER_FP16: true
  INPUT_CHANNEL_SAMPLE_RATE: 0.001
  INPUT_CHANNEL_SAMPLE_SIZE: 1024
  LEARN_WEIGHT_BOUNDS: false
  METHOD: quantdemoire
  N_BITS_A: 4
  N_BITS_W: 4
  QUANT_MODE: online
  QUANT_STATE_PATH: outputs/ptq/esdnet_uhdm_deploy_w4a4_s123/quant_state.pth
  SAVE_QUANT_STATE: true
  SKIP_FIRST_CONV: true
  SKIP_LAST_CONV: true
  SMOOTH_ALPHA: 0.5
  USE_SMOOTH_SCALE: true
  WEIGHT_OBSERVER: minmax
  WEIGHT_OUTLIER_MODE: rank_fp16
  WEIGHT_OUTLIER_PERCENTILE: 0.25
  WEIGHT_PERCENTILE_HIGH: 99.5
  WEIGHT_PERCENTILE_LOW: 0.5
  WEIGHT_SYMMETRIC: true
TEST:
  EVALUATION_METRIC: true
  LOAD_PATH: checkpoints/uhdm_checkpoint.pth
  SAVE_IMG: false
  TEST_EPOCH: auto
TRAIN:
  BATCH_SIZE: 1
  CROP_SIZE: 512
  LAM: 1
  LAM_P: 1
  LOADER: crop
  LOAD_EPOCH: false
  RESIZE_SIZE: 384
  SAVE_ITER: 500
