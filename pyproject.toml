[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantdemoire"
version = "0.1.0"
description = "ESDNet UHDM quantization and integer CUDA deployment"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.2.2", "torchvision==0.17.2", "numpy==1.26.4",
  "Pillow==11.3.0", "PyYAML==6.0.2", "tqdm==4.67.1",
  "lpips==0.1.4", "ninja==1.11.1.4", "safetensors==0.5.3",
  "setuptools==75.8.0",
]

[tool.setuptools]
license-files = ["LICENSE-UHDM.txt"]

[tool.setuptools.packages.find]
include = ["quantdemoire*", "kernel*"]

[tool.setuptools.package-data]
kernel = ["csrc/*.cu", "csrc/*.cuh", "csrc/*.cpp"]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
